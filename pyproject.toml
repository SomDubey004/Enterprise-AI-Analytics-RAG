[project]
name = "enterprise-ai-analytics-rag"
version = "0.1.0"
description = "Enterprise AI Analytics and RAG Data Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)"
]

[tool.poetry]
packages = [
    { include = "enterprise_ai", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
